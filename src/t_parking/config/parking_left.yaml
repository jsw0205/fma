# ===================================================================
# t_parking : 좌측 T자 후진 주차 파라미터 (실차)
#
# [!!] 로 표시한 항목은 반드시 실측값으로 바꿔야 하는 것들이다.
#      나머지는 제공된 제원표에서 그대로 왔거나 안전한 초기값이다.
# ===================================================================

rule_based_t_parking_node:
  ros__parameters:

    # ---------------- topics / frames ----------------
    scan_topic: "/scan_parking"
    odom_topic: "/wheel_odom"
    odom_frame: "odom"
    base_frame: "base_link"

    # ---------------- LiDAR 장착 (뒤집힘 반영) ----------------
    # 유효각 = laser_yaw + laser_yaw_extra + laser_angle_sign * theta_raw
    #   laser_angle_sign = -1.0  <- 라이다를 뒤집어 달았으므로 (Rx(pi), 반사)
    #   laser_yaw        = pi    <- raw 180deg 가 차량 정면
    # 검산: raw180->0(앞), raw90->+90(좌), raw270->-90(우), raw0->180(뒤)
    laser_x: 1.175
    laser_y: 0.0
    laser_yaw: 3.14159265
    laser_yaw_extra: 0.0          # 미세 정렬 오차만 여기서 보정
    laser_angle_sign: -1.0

    # ---------------- 차량 제원 (제공된 표) ----------------
    vehicle_length: 1.410
    vehicle_width: 0.800
    wheel_base: 0.735
    track_width: 0.670
    base_to_front_bumper: 1.175
    base_to_rear_bumper: 0.230

    side_margin: 0.15             # 슬롯 좌우 필요 여유 (편도)
    back_margin: 0.20             # 뒤 범퍼 - 뒷벽 목표 여유
    min_goal_inside_depth: 0.10
    collision_margin: 0.10

    # ---------------- 조향 / 회전반경 ----------------
    # [!!] radius_mode
    #   'bicycle' : wheel_base 와 최대 조향각으로 R = L/tan(delta) 계산
    #   'table'   : 실측 반경표 사용 (미니카 표는 절대 재사용 금지)
    # 실차에서 최대조향 정타 원선회를 좌/우 각각 1회 돌려 반경을 재고,
    # 그 값이 bicycle 계산과 다르면 table 로 바꿀 것.
    radius_mode: "bicycle"
    max_steer_cmd: 30
    # HENES 실측값 (parallel_parking/config/parking_parallel_right.yaml과 동일 -
    # 조향 기하는 좌/우 주차 로직과 무관하게 차량 고유값이다).
    # -30: R=2.154m -> 18.84deg, +30: R=2.255m -> 18.05deg
    max_steer_angle_left_deg: 18.84
    max_steer_angle_right_deg: 18.05
    left_radius_table: ""              # 예: "10:6.0,20:2.8,30:1.30" (뒤 차축 반경)
    right_radius_table: ""
    radius_is_center: false
    forward_turn_sign: -1.0            # [!!] 전진 시 조향부호->yaw부호. 반대면 +1.0
    setup_steer_abs: 30
    reverse_steer_abs: 30
    steer_deadband_cmd: 2

    # ---------------- 속도 명령 (느리게 시작) ----------------
    pre_straight_rpm: 30
    setup_forward_rpm: 30
    reverse_rpm: -30
    final_rpm: -8
    cmd_rate: 20.0

    # ---------------- 출차 (2026-08-05, 2026-08-07 실차 확인 후 자동화) ----------------
    # 주차 성공 확인 (2026-08-07) - 3초 대기 후 자동으로 직진 출차하도록 켬.
    auto_exit: true
    parking_hold_sec: 3.0
    # approach_rpm(30)과 동일하게 - "rpm 30으로 한 1초만 나오면 될듯".
    # exit_clear_margin(아래)이 실제 완료 시점을 정하고, 이 rpm에서 대략
    # 1초 안팎에 그 여유를 통과하게 되는 정도.
    exit_forward_rpm: 30
    # 뒷범퍼가 슬롯 입구선을 이 여유만큼 지나야 완전히 빠져나온 걸로 판단.
    # 시간이 아니라 거리 기준(entrance_clearance, 라이다 재확인 없이 odom-
    # lock된 슬롯 기하로 계산) - rpm을 나중에 또 바꿔도 이 판정 기준은 안
    # 흔들림.
    exit_clear_margin: 0.30
    exit_timeout_sec: 30.0

    # ---------------- ABORT 자동 복귀 (2026-08-11) ----------------
    # ABORT(주로 rear clearance safety stop)가 뜨면 사람이 /parking_reset
    # 안 해줘도, abort_hold_sec 대기 후 exit_forward_rpm으로
    # abort_forward_sec만큼 직진하고 DONE(제어권 반환) - "abort뜨고 3초
    # 뒤에 앞으로 2초 나오고 복귀" 요청 반영.
    auto_recover_from_abort: true
    abort_hold_sec: 3.0
    abort_forward_sec: 2.0

    # ---------------- ROI (좌측 주차: y > 0) ----------------
    parking_side: "left"
    roi_x_min: -0.60
    roi_x_max: 8.00
    roi_y_min: 0.20
    roi_y_max: 4.50
    self_mask_extra: 0.08

    # ---------------- 콘 물리 모델 [!!] ----------------
    # 라이다를 높이 달아 콘이 잘 안 잡히는 문제를 여기서 정면으로 다룬다.
    # 스캔면에서의 콘 단면폭 = cone_base_diameter * (1 - scan_height/cone_height)
    # 이 값이 0.03 m 미만이면 노드가 시작 시 에러 로그를 띄운다.
    cone_height: 0.450
    cone_base_diameter: 0.280
    cone_plate_diameter: 0.0
    scan_height: 0.160            # 지면~스캔면 (0.15~0.17 중앙값)

    # ---------------- 콘 검출 ----------------
    min_range: 0.25
    max_range: 8.0
    range_sigma: 0.020

    cluster_lambda_deg: 10.0      # 적응형 분할 (Dietmayer)
    cluster_gap_min: 0.030
    cluster_gap_max: 0.220
    max_index_gap: 3

    min_cluster_points: 1         # 먼 콘은 1점도 허용 (n_exp 게이트가 대신 막는다)
    # S2 DenseBoost는 근거리 콘 하나에도 수백 개 빔이 맞을 수 있다. 해상도와
    # 무관한 너무 낮은 상한은 정상 콘을 벽으로 오판한다(t_parking_yellow 튜닝값).
    # 실제 벽 제거는 아래 n_exp 비율과 물리 폭 게이트가 담당한다.
    max_cluster_points: 400
    n_exp_min_ratio: 0.30         # n >= 0.30 * 예상히트수
    n_exp_max_ratio: 3.20         # n <= 3.20 * 예상히트수 -> 초과하면 벽
    width_min_ratio: 0.25
    width_max_ratio: 1.80
    max_cluster_width: 0.45

    isolation_enable: true        # 콘은 주변이 비어 있다 (벽/연석 제거)
    isolation_jump: 0.22
    isolation_search: 4
    isolation_require_both: false

    convexity_enable: true        # 센서쪽으로 볼록한 짧은 원호인지
    convexity_min_points: 4
    sagitta_min: 0.004
    sagitta_max_ratio: 1.25
    radial_spread_max_ratio: 1.30

    use_intensity: false          # 반사 테이프가 있으면 true + min_intensity 조정
    min_intensity: 0.0

    track_merge_dist: 0.28        # odom 프레임 트랙 결합거리
    track_alpha: 0.45
    min_track_hits: 3             # 3프레임 확정 -> 순간 노이즈 제거
    max_track_miss_sec: 1.2
    # 원거리 콘은 가림/약한 반사로 매 프레임 검출되지 않는다. 가까운 노이즈
    # 기준은 그대로 두고, 지정 거리 밖의 트랙만 빨리 확정하고 더 오래 유지한다.
    far_track_range: 3.0
    far_min_track_hits: 2
    far_track_miss_sec: 2.5

    # ---------------- 슬롯(주차공간) 검출 [!!] ----------------
    # entry_*, slot_* 은 실제 코스 실측치로 반드시 교체.
    # 하드 하한: entry_min_width >= vehicle_width + 2*side_margin = 1.10
    min_cones_for_plan: 3
    entry_min_width: 1.05
    entry_max_width: 3.00
    entry_expected_width: 1.30
    entry_pair_max_depth_diff: 0.30
    entry_line_tol: 0.30
    entry_require_adjacent: true
    entry_adjacent_margin: 0.15
    max_candidate_entry_dist: 7.0
    # 0이면 횡거리 추가 제한을 사용하지 않는다. 실제 코스에서 3.4 m는
    # 전방 거리이고 입구 횡거리는 약 0.6~0.9 m이므로 폭/안정성으로 판정한다.
    candidate_min_lateral_abs: 0.0
    candidate_max_lateral_abs: 0.0
    # 촘촘한 콘 경계에서 [entry_min_width, entry_max_width] 범위의
    # 실제 빈 간격을 입구로 사용한다. 서로 다른 평행 경계가 보이면 차량에서
    # 처음 만나는 유효 경계의 빈틈을 우선한다. 특정 폭/횡거리에 고정하지 않는다.
    entrance_gap_mode: true

    # 주 검출 방식: 차량이 전진할 때 측면 경계의
    #   막힘 -> 열림 -> 다시 막힘
    # 두 전이 위치를 odom에 저장하고 그 사이 실주행거리를 입구 폭으로 사용.
    # 콘 두 개가 한 프레임에 동시에 보여야 하는 pair 패턴을 요구하지 않는다.
    temporal_gap_enable: true
    gap_side_window_along: 0.22   # 라이다 옆 수직 측정창의 진행방향 반폭
    gap_open_jump: 0.60           # 학습한 경계보다 이만큼 깊어지면 열림
    gap_close_jump: 0.30          # 경계 근처로 돌아오면 다시 막힘
    gap_confirm_frames: 3         # 콘 사이 순간 빈틈 제거
    gap_baseline_alpha: 0.25      # 차량-경계 거리의 느린 변화 추종
    # 차폭 안쪽 반사는 외부 경계일 수 없다. 값을 지정하지 않으면
    # 0.5*vehicle_width + self_mask_extra로 자동 계산된다.
    gap_side_min_lateral: 0.48

    # 입구만으로 슬롯을 인식할 때 경로 생성에 사용할 내부 깊이.
    # 입구 폭과 중심은 LiDAR 실측값을 그대로 사용한다.
    entrance_default_depth: 2.00

    slot_min_depth: 1.50
    slot_max_depth: 3.50
    slot_expected_depth: 2.00
    depth_percentile: 88.0
    rear_cone_band: 0.30
    wall_lateral_extra: 0.25
    depth_min_positive_s: 0.15
    goal_depth_override: 0.0

    # 접근로/입구/측벽 콘이 함께 보이면 전체 콘 RANSAC 축이 실제 주행축에서
    # 기울어진다. 출발 IMU 헤딩을 u축으로 사용하고, 차량과 콘 사이 거리 및
    # 입구 폭은 매 프레임 실측한다(고정 거리/고정 폭 패턴을 사용하지 않음).
    lane_fit_enable: false
    lane_ransac_tol: 0.18
    lane_ransac_iters: 150
    lane_max_angle_deg: 25.0
    lane_min_inliers: 3

    interior_cone_reject: true    # 슬롯 내부에 콘이 있으면 탈락
    interior_margin_u: 0.12
    interior_back_band: 0.35
    interior_front_band: 0.10
    max_interior_cones: 0

    interior_raw_reject: true     # 슬롯 내부에 원시 점군이 있으면 점유로 판정
    interior_raw_min_points: 6    # (슬롯에 다른 차가 서 있는 경우 차단)
    interior_raw_clear_ratio: 0.75

    entry_boundary_check_enable: true
    entry_front_tolerance: 0.20
    max_entry_front_count: 1
    entry_offset: 0.05

    # ---------------- APPROACH / lock ----------------
    pre_straight_yaw_kp: 30.0
    pre_straight_wz_kd: 6.0
    pre_straight_steer_sign: 1
    pre_straight_max_steer: 8
    pre_straight_min_steer: 3       # 실차 중립 편향/조향 데드존 극복
    pre_straight_yaw_deadband_deg: 0.3
    pre_straight_min_lateral_abs: 0.60
    pre_straight_arm_x_min: 1.00
    pre_straight_stable_window: 4
    pre_straight_width_stable_tol: 0.15
    pre_straight_depth_stable_tol: 0.20
    lock_modom_stable_tol: 0.20    # odom 프레임에서 슬롯 중점이 흔들리는 허용치
    pre_straight_timeout_sec: 0.0
    lock_require_feasible: true    # 불가능한 계획으로는 lock 하지 않는다
    lock_require_start_ahead: true # 시작점을 이미 지난 후보는 lock 하지 않는다
    lock_start_ahead_margin: 0.25
    stop_hold_sec: 1.0
    # See parallel_parking/config/parking_parallel_right.yaml's identical
    # 2026-08-12 comment - same slope-creep margin, same settle_timeout_sec
    # backup in rule_based_t_parking_node.py.
    stop_speed_thresh: 0.10

    # ---------------- 2원호 목표 분해 ----------------
    # 실차 R_rev(1.27 m) < z_goal(1.57 m) 이므로 단발 2원호가 불가능하다.
    #   z_arc      = min(z_goal, R_rev - y_a - arc_depth_margin)  <- 원호 담당
    #   z_straight = z_goal - z_arc                               <- 직진후진 담당
    arc_depth_margin: 0.10
    min_z_arc: -1.20
    max_straight_back: 3.00
    validate_plan: true            # 계획 궤적 스윕 충돌 검증
    sim_ds: 0.03
    plan_min_clearance: 0.05
    abort_on_plan_collision: true
    # 첫 입구 후보의 경로가 콘과 겹치면 전체 시퀀스를 ABORT하지 않고,
    # 그 후보만 거절한 뒤 더 넓고 안정적인 입구 후보를 계속 찾는다.
    # 충돌 경로 자체를 실행하지는 않으므로 안전 검사는 그대로 유지된다.
    continue_on_plan_collision: true

    # ---------------- 아크 / 종단 ----------------
    setup_yaw_tolerance_deg: 3.0
    reverse_yaw_tolerance_deg: 3.0
    arc_absolute_timeout_sec: 60.0
    setup_max_forward_dist: 2.50
    reverse_max_dist: 6.00
    recompute_at_start: true
    reverse_yaw_kp: 6.0
    reverse_center_kp: 9.0
    reverse_align_max_steer: 10

    # 후진 직진 중 전방 입구콘 재관측으로 중앙선 보정 (선택. 먼저 false 로 검증)
    reverse_straight_use_live_entry: false
    reverse_straight_live_weight: 0.4

    # ---------------- 완료 조건 ----------------
    centerline_tolerance: 0.08
    rear_goal_tolerance: 0.10
    # 0.25 -> 0.20 (2026-08-07): 실차에서 clear=0.246m로 마진 4mm 차이로
    # ABORT됨 (거의 정상 완료 직전) - 여유를 좀 더 줌. 계속 이 근처에서
    # 걸리면 더 낮추기 전에 rear_goal_tolerance/depth 설정 자체를 먼저
    # 재검토할 것 (마진을 너무 낮추면 안전 여유가 실질적으로 없어짐).
    rear_safety_stop_margin: 0.20
    final_yaw_tolerance_deg: 6.0
    final_wz_tolerance: 0.12
    final_start_yaw_tolerance_deg: 8.0

    # ---------------- 출력 / 로깅 ----------------
    auto_start: false
    direct_cmd_output: true
    log_enable: true
    log_root: "~/.ros/parking_logs"
    # RPLiDAR S2 실측 각해상도(0.1125deg, DenseBoost 기준) - 시작 배너의
    # 검출거리 추정용. 기존 0.25는 다른 라이다 기준이었던 값.
    assumed_angle_increment_deg: 0.1125


scan_parking_filter:
  ros__parameters:
    input_scan: "/scan"
    output_scan: "/scan_parking"
    min_range: 0.25
    max_range: 8.0
    # 주차 노드와 동일하게 유지할 것
    laser_yaw: 3.14159265
    laser_yaw_extra: 0.0
    laser_angle_sign: -1.0
    # 차량프레임 유지창 (0=정면, +=좌). 좌측 주차이므로 좌측을 넉넉히.
    keep_min_deg: -120.0
    keep_max_deg: 150.0
    publish_debug_frame: true
    debug_period_sec: 2.0


wheel_odom_front_axle:
  ros__parameters:
    odom_frame: "odom"
    base_frame: "base_link"
    odom_topic: "/wheel_odom"
    publish_tf: true
    publish_rate: 50.0

    wheel_base: 0.735
    counts_per_m: 341.295007
    m_per_count: 0.002930016494
    encoder_modulus: 65536
    encoder_sign: 1.0
    encoder_on_front_axle: true     # 구동모터가 앞에 있으므로 true
    max_jump_counts: 20000

    steer_cmd_topic: "/cmd_steer"
    max_steer_cmd: 30
    max_steer_angle_left_deg: 18.84  # 주차 노드와 같은 값 (HENES 실측)
    max_steer_angle_right_deg: 18.05
    steer_cmd_sign: 1.0
    steer_lag_alpha: 0.35

    yaw_source: "fused"             # imu 있으면 fused/imu 권장
    imu_topic: "/imu/data"
    imu_timeout_sec: 0.5

    # ---- CAN [!!] 아래 4개는 차량 펌웨어 문서/덤프로 확인해서 채울 것 ----
    encoder_topic: ""               # 비우면 CAN 직접 수신
    can_interface: "can0"
    encoder_can_id: 0               # 0 = 모든 ID 허용 (임시)
    count_byte_offset: 0
    count_byte_len: 2
    count_little_endian: true
    count_signed: false
    dump_frames: false              # true 로 띄워서 프레임 배치 확인
